            # 卢德运动与怠工：历史与当代的思考
            ### 卢德主义态度分享会
            <br>
            <p style="font-size: 0.5em; color: #888;">讲稿整理自：分享会草稿</p>

            # 第一部分
            ## 暖场：当代的怠工与抗争
            
            ---
            
            ### 当代的怠工形式：日常抵抗
            * **表现形式**：摸鱼、偷懒、按章工作、唠嗑、饭后散步、Coffee Break、假装工作。
            * **特点**：去中心化、高度个体化、以微观防御为主。
            * **思考**：集体性的怠工需要怎样的外部条件？在原子化的当代，集体抗争如何凝聚？
            
            <div class="image-placeholder">【图片占位】现代办公室白领日常“摸鱼/假装工作”的写实照片/插画</div>
            
            ---
            
            ### AI 与控制的智能化
            * **Human in the Loop -> Human Chasing the Loop**：Agent 运行过快，人沦为数据喂养与动作追赶的附庸。
            * **快乐的流失与痛苦的残留**：
              * 技术夺走了富有创造力的“快乐劳动”（如创意性编码）。
              * 留下了高度机械化的“痛苦劳动”（如CR、测试、修排版、应付审核）。
            * **控制方式的精细化**：系统算法对工时和进度的无限监控与压榨。
            
            <div class="image-placeholder">【图片占位】人类程序员在 AI Agent (Human chasing the loop) 节拍下疲于奔命的讽刺漫画</div>
            
            ---
            
            ### 历史上的怠工抗争谱系
            * **卢德运动 (1811-1816)**：精确破坏设备以抗衡资本主义生产关系的恶化。
            * **早期工团主义 (Syndicalism)**：用 <span class="highlight-text">"Sabotage"</span> 作为工厂内的直接斗争武器。
            * **苏俄早期的工厂委员会**：革命洪流中劳动阶级争取车间自治的尝试。
            * **实存社会主义国家后期**：在无解雇压力下的日常消极冷感与非正式经济。
            * **意大利工人主义 (1970s)**：主张“拒绝劳动”，反抗全社会范围内的资本剥夺。
            * **算法下的零工**：现代外卖骑手利用位置欺骗和对抗算法。
            
            ---
            
            # 第二部分
            ## 卢德运动：历史、背景与理论资源
            
            ---
            
            ### 什么是卢德运动？
            * **时间**：1811年－1816年（英国对拿破仑战争的艰难时期）。
            * **地点**：英格兰中部与北部的手工业重镇（诺丁汉、约克郡、兰开夏等）。
            * **行动者**：传统手工业工匠，主要是针织工（Stockingers）与剪绒工（Croppers）。
            * **后世偏见**：将“卢德主义”污名化为“盲目反对一切技术的愚昧破坏者”。
            
            <div class="image-placeholder">【图片占位】19世纪初假想的卢德分子精神领袖“内德·卢德将军”的木刻画像</div>
            
            ---
            
            ### 卢德运动：历史背景
            1. **工业革命开端**：宽幅织袜机和剪绒机推广，用廉价童工/女工取代高技能工匠。
            2. **生活方式破碎**：手工业者的独立性与社区自治被“工厂纪律”强制摧毁。
            3. **结社网络传统**：传统的行会文化、地方非国教卫理公会网络提供了保密性极高的地下结社资源。
            4. **国家政治气候**：
              * 对法战争导致严重通胀、失业与粮食危机。
              * 《结社法》（Combination Acts）严禁一切公开的工人阶级工会组织。
            
            <div class="image-placeholder">【图片占位】18世纪末英国传统针织作坊与早期水力棉纺织厂的对比图</div>
            
            ---
            
            ### 精准打击：斗争经过
            * **行动者视角**：写警告信，黑夜集结，使用大铁锤精准砸毁破坏劳动条件、制造劣质产品的特定宽幅机（不破坏普通机器和私人物品）。
            * **国家政权视角**：派出了比半岛战争中还要多的军队，通过《破坏机器死刑法案》。
            * **关键节点**：
              * **1811年**：诺丁汉郡的起义与机器破坏。
              * **1812年**：约克郡卡特赖特磨坊突袭战。
              * **1813年**：约克大审判，大规模处以绞刑与流放。
            
            <div class="image-placeholder">【图片占位】1812年卢德分子夜袭纺织厂，使用“以诺”大锤砸毁机器的版画</div>
            
            ---
            
            ### 历史遗产与学术分歧
            * **后续演变**：失败后转入合法的早期工会运动，最终汇入1830-40年代的**宪章运动**。
            * **两种学术视角的交锋**：
              * **费边社（韦布夫妇等）**：持精英历史观，认为这不过是工人阶级在挨饿时的无组织狂怒，是“肚子里的反叛” (Rebellions of the belly)。
              * **汤普森 (E.P. Thompson)**：指出这是手工业工匠为了捍卫道德经济学、抗争“无管制自由市场”的理性政治选择。
            
            <div class="image-placeholder">【图片占位】1830-40年代宪章运动时期，英国工人群体庞大的和平集会海报与传单</div>
            
            ---
            
            ### 理论资源：多维度的透视
            * **汤普森**：<span class="highlight-text">阶级形成 (Class Formation)</span> 并非经济结构的自然产物，而是文化、道德体验和共同抗争的有机凝聚。
            * **布雷弗曼**：<span class="highlight-text">去技能化 (Deskilling)</span> 是资本通过剥夺工人技艺，从而夺取车间控制权与分配谈判权的控制过程。
            * **恩格斯**：在《英国工人阶级状况》中指出，机器是资本对付工人的最强大武器。
            * **波兰尼**：自由市场将“劳动力商品化”对传统社会造成致命打击，破坏机器是社会应对市场泛滥的“自我保护运动”（双重运动）。
            
            ---
            
            # 第三部分
            ## 历史回响、争论与实践演变
            
            ---
            
            ### 怠工概念的谱系
            <div class="slide-quote">
              “摸鱼 (Slacking) 与 搞破坏 (Sabotage) 的区别与联系。”
            </div>
            * **摸鱼**：个体化、防御性，旨在通过微观的时间管理争取日常的“自主飞地”。
            * **破坏 (Sabotage)**：集体性、进攻性，公开挑战生产资料的占有与资本的绝对控制。
            * **联系**：微观摸鱼形成的“默契”，往往构成了大集体抗争时的底层信任纽带。
            
            ---
            
            ### 世纪之交的社民主义大论战
            * **第二国际与科学社会主义**：
              * **考茨基**：承认怠工来自压迫，但强调无产阶级必须建立工厂纪律，反对无序破坏。
              * **罗莎·卢森堡**：高度赞扬群众性“总罢工”，但认为怠工和暗中破坏会削弱工人阶级的阶级道德。
              * **工会改良派**：认为破坏行动会败坏工会声誉，疏远公众同情。
            * **法国工团主义与美国工会 (IWW)**：
              * 极大地发展了 "Sabotage" 战术：在车间内公开怠工，实施“坏待遇配坏活”，直接敲打资本家。
            
            ---
            
            ### 苏俄早期的工厂委员会与“反怠工”
            * **1917年的工厂委员会**：不同于苏维埃，由工人自发建立，是十月革命前夕工人直接掌握生产控制权的自治机关。
            * **建政后的国家视角转向**：
              * 革命胜利后，消极怠工转而危害新生的苏维埃政权。
              * 托洛茨基提倡“劳动军事化”；列宁引入泰勒制（科学管理）和个人负责制以提升国家生产率。
              * **反怠工政治化**：Sabotage 被重塑为反革命破坏罪（如沙赫蒂审判）。
            
            <div class="image-placeholder">【图片占位】苏俄早期动员工人们“消灭消极怠工、保障红军前线”的革命宣传画</div>
            
            ---
            
            ### 实存社会主义国家的“工业冷感”
            <div class="slide-quote">
              “他们假装发工资，我们假装工作。”
            </div>
            * **非资本主义控制下的困境**：
              * 终身制、福利保障与缺乏解雇压力使得资本主义的传统鞭子失效。
              * 工人发展出*按章工作*、*影子经济* 等日常怠工网络。
            * **后果分化**：东德案例表明，日常怠工并未催生团结，反而伴随着工人间的相互提防与政治冷感。
            
            <div class="image-placeholder">【图片占位】波兰/东德后期工厂车间中，工人漫不经心、消极应对计划考核的历史照片</div>
            
            ---
            
            ### 其他抗争实践的启示
            * **意大利工人主义 (Operaismo)**：1970年代提出“拒绝劳动” (Refusal of Work)——不与资本谈判如何更好工作，而是拒绝被转化为不断增值的活劳动。
            * **韩国“学生工” (1980s)**：知识分子伪装进入工厂，“争做最熟练的工人”，通过卓越技术获取工人群体中的极高声望，以此建立组织，而非直接摸鱼。
            * **零工经济中的博弈**：外卖骑手联合使用GPS干扰器或反向喂给虚假数据来对抗控制算法。
            
            <div class="image-placeholder">【图片占位】1969年意大利都灵菲亚特厂“热秋”大罢工，工人们在厂房内游行的历史照片</div>
            
            ---
            
            # 第四部分
            ## 总结：重回卢德主义的启示
            
            ---
            
            ### 话题一：摸鱼与团结的辩证法
            * **促成团结**：建立微观的“防卫飞地”，在没有监视的非正式空间形成攻守同盟，为集体行动沉淀人际信任。
            * **瓦解团结**：在匮乏环境下变成恶性推诿责任、将工作负担转嫁他人、甚或向管理者告密。
            * **思考**：在你们所处的劳动场域中，日常的“摸鱼”到底是形成了工人网络，还是进一步分化了大家？
            
            ---
            
            ### 话题二：传统、道德经济学与AI
            * **旧瓶装新酒**：卢德分子利用古老的“道德经济学”和国王的“家长制契约”为捣毁机器合法化。
            * **当代的AI抗争**：
              * 在代码被 AI 精准接管、监控空前严密的今天，我们能从过去的文化传统或行业道德中汲取哪些斗争规范？
              * 如何利用系统漏洞或反向喂给虚假数据（反向毒化）来与AI控制博弈？
            
            ---
            
            ### 话题三：什么是好的劳工与社会研究？
            * **反思两种偏差**：
              * **救世主式**：强行代入先锋队视角，忽视具体工人的真实生活痛点和局限性。
              * **尸体解剖式**：将工人作为无声的统计数据，用死板的量化模型拼凑阶级画像。
            * **好的研究**：潜入工人的“微观体验”，理解其生活世界（Lebenswelt），看到他们在历史巨变中如何作为“能动的主体”拼死搏斗。
