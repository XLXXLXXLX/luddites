<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>砸机器之后：观众版逐页内容 v6</title>
  <link rel="stylesheet" href="/static/revealjs/reset.css">
  <link rel="stylesheet" href="/static/revealjs/reveal.css">
  <link rel="stylesheet" href="/static/revealjs/theme/white.css" id="theme">
  <style>
    /* ============================================================
       v6 视觉系统
       背景保持单一浅纸色；颜色只出现在元素上（阶段标识、表头、
       规则线、强调数字、证据类型），不作页面底色。
       ============================================================ */
    :root {
      --paper: #fdfcfa;
      --paper-sunk: #f5f1e9;
      --ink: #17150f;
      --ink-soft: #55504a;
      --ink-faint: #8b8479;
      --rule: #ded8cc;
      --rule-strong: #b6ae9f;

      --c-open: #4c4740;
      --c-notts: #9d3a26;
      --c-yorks: #2b4a6e;
      --c-lancs: #8f5d0d;
      --c-compare: #4c4740;
      --c-theory: #4f4a66;
      --c-ai: #35596b;
      --c-appendix: #7c766c;
      --c-evidence: #8a6a3f;

      --stage: var(--c-open);

      --font-body: system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      --font-source: Georgia, "Iowan Old Style", "Times New Roman", "Songti SC", serif;

      --r-background-color: var(--paper);
      --r-main-color: var(--ink);
      --r-heading-color: var(--ink);
      --r-main-font: var(--font-body);
      --r-heading-font: var(--font-body);
      --r-link-color: var(--ink);
      --r-link-color-hover: var(--ink);
    }

    /* 阶段色只绑定到 --stage，供元素引用 */
    .reveal .stage-open     { --stage: var(--c-open); }
    .reveal .stage-notts    { --stage: var(--c-notts); }
    .reveal .stage-yorks    { --stage: var(--c-yorks); }
    .reveal .stage-lancs    { --stage: var(--c-lancs); }
    .reveal .stage-compare  { --stage: var(--c-compare); }
    .reveal .stage-theory   { --stage: var(--c-theory); }
    .reveal .stage-ai       { --stage: var(--c-ai); }
    .reveal .stage-appendix { --stage: var(--c-appendix); }

    html, body { background: var(--paper); }

    .reveal {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- 版面骨架 ---------- */
    .reveal .slides section {
      box-sizing: border-box;
      height: 100%;
      padding: 50px 84px 62px;
      text-align: left;
      font-size: 32px;
      line-height: 1.34;
    }
    .reveal .slides section.present {
      display: flex !important;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      text-align: left;
    }
    .reveal .slide-body {
      min-width: 0;
      width: 100%;
      margin-left: 0;
      margin-right: 0;
      text-align: left;
    }
    .reveal .slides section.present > h1,
    .reveal .slides section.present > .slide-body {
      width: 100%;
      align-self: stretch;
      margin-left: 0;
      margin-right: 0;
      text-align: left !important;
    }
    .reveal .slide-body > * {
      margin-left: 0;
      margin-right: 0;
      text-align: left !important;
    }
    .reveal .slide-body > :first-child { margin-top: 0; }
    .reveal .slide-body > :last-child { margin-bottom: 0; }

    /* ---------- 标题 ---------- */
    .reveal h1,
    .reveal h2,
    .reveal h3,
    .reveal h4 {
      color: var(--ink);
      font-family: var(--font-body);
      text-transform: none;
      letter-spacing: normal;
    }
    .reveal h1 {
      position: relative;
      margin: 0 0 0.6em;
      font-size: 1.4em;
      font-weight: 650;
      line-height: 1.18;
      letter-spacing: -0.005em;
    }
    /* 阶段标记：每页标题上方一段短线，颜色即阶段色 */
    .reveal .slides section > h1::before {
      content: "";
      display: block;
      width: 52px;
      height: 3px;
      margin-bottom: 0.32em;
      background: var(--stage);
    }
    .reveal h2 { font-size: 1.16em; font-weight: 600; }
    .reveal h3 { font-size: 1.04em; font-weight: 600; }

    .reveal p,
    .reveal ul,
    .reveal ol {
      margin-top: 0.36em;
      margin-bottom: 0.36em;
    }
    .reveal ul,
    .reveal ol { padding-left: 1.1em; }
    .reveal li + li { margin-top: 0.14em; }
    .reveal ul li::marker { color: var(--stage); }
    .reveal ol li::marker { color: var(--stage); font-weight: 600; }
    .reveal strong { font-weight: 650; }

    .reveal code {
      padding: 0.06em 0.28em;
      background: var(--paper-sunk);
      border-radius: 3px;
      color: var(--ink);
      font-family: var(--font-source);
      font-size: 0.92em;
    }

    /* ---------- 表格：去除竖线与网格感 ---------- */
    .reveal table {
      width: 100%;
      margin: 0.3em 0 0.4em;
      border-collapse: collapse;
      font-size: 0.84em;
      line-height: 1.26;
    }
    .reveal th,
    .reveal td {
      padding: 0.34em 0.9em 0.34em 0;
      vertical-align: top;
      border: 0;
    }
    .reveal th {
      color: var(--stage);
      font-weight: 650;
      border-bottom: 2px solid var(--stage);
      letter-spacing: 0.01em;
    }
    .reveal td { border-bottom: 1px solid var(--rule); }
    .reveal tbody tr:last-child td { border-bottom: 0; }
    .reveal tbody td:first-child {
      color: var(--ink);
      font-weight: 600;
    }
    .reveal th:last-child,
    .reveal td:last-child { padding-right: 0; }
    .reveal table [align="right"],
    .reveal th[align="right"],
    .reveal td[align="right"] {
      text-align: right !important;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- 引文与证据类型 ---------- */
    .reveal blockquote {
      width: 100%;
      margin: 0.4em 0;
      padding: 0 0 0 0.72em;
      border-left: 3px solid var(--rule-strong);
      font-size: 1em;
      line-height: 1.36;
      box-shadow: none;
      background: none;
    }
    .reveal blockquote p { margin: 0.18em 0; }
    .reveal blockquote:has(.source-excerpt) { border-left-color: var(--c-evidence); }

    .reveal .source-line {
      margin-top: 0.7em;
      padding-top: 0.34em;
      border-top: 1px solid var(--rule);
      color: var(--ink-faint);
      font-size: 0.62em;
      line-height: 1.3;
    }
    .reveal .evidence-note {
      color: var(--ink-soft);
      font-size: 0.78em;
      line-height: 1.32;
    }
    .reveal .evidence-note::before {
      content: "";
      display: inline-block;
      width: 0.52em;
      height: 0.52em;
      margin-right: 0.42em;
      background: var(--c-evidence);
      transform: translateY(-0.05em);
    }

    .reveal a {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--rule-strong);
      text-underline-offset: 0.16em;
      overflow-wrap: anywhere;
    }

    /* ---------- 页码与阶段标签 ---------- */
    .reveal .slide-page-number {
      position: absolute;
      left: 84px;
      bottom: 22px;
      z-index: 2;
      color: var(--ink-faint);
      font-family: var(--font-body);
      font-size: 17px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      pointer-events: none;
    }
    .reveal .slide-region-label {
      position: absolute;
      top: 22px;
      right: 84px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 0.5em;
      color: var(--stage);
      font-size: 16px;
      font-weight: 650;
      line-height: 1;
      letter-spacing: 0.06em;
      pointer-events: none;
    }
    .reveal .slide-region-label::before {
      content: "";
      width: 9px;
      height: 9px;
      background: var(--stage);
      border-radius: 50%;
    }

    /* 进度条按阶段着色 */
    .reveal .progress { height: 4px; color: var(--rule); background: var(--rule); }
    .reveal[data-stage="open"] .progress span     { background: var(--c-open); }
    .reveal[data-stage="notts"] .progress span    { background: var(--c-notts); }
    .reveal[data-stage="yorks"] .progress span    { background: var(--c-yorks); }
    .reveal[data-stage="lancs"] .progress span    { background: var(--c-lancs); }
    .reveal[data-stage="compare"] .progress span  { background: var(--c-compare); }
    .reveal[data-stage="theory"] .progress span   { background: var(--c-theory); }
    .reveal[data-stage="ai"] .progress span       { background: var(--c-ai); }
    .reveal[data-stage="appendix"] .progress span { background: var(--c-appendix); }
    .reveal .controls { color: var(--ink-faint); }

    /* ---------- 密度 ---------- */
    .reveal .slides section.size-roomy { font-size: 35px; }
    .reveal .slides section.size-dense { font-size: 29px; }
    .reveal .slides section.size-compact {
      padding-top: 38px;
      padding-bottom: 54px;
      font-size: 28px;
      line-height: 1.26;
    }
    .reveal .size-compact h1 { margin-bottom: 0.44em; }
    .reveal .size-compact p,
    .reveal .size-compact ul,
    .reveal .size-compact ol {
      margin-top: 0.26em;
      margin-bottom: 0.26em;
    }

    /* ---------- 封面 ---------- */
    .reveal .slides section.title-slide { font-size: 39px; }
    .reveal .title-slide h1 {
      font-size: 1.62em;
      font-weight: 700;
      letter-spacing: -0.012em;
    }
    .reveal .slides section.title-slide > h1::before {
      width: 92px;
      height: 4px;
      margin-bottom: 0.34em;
    }
    .reveal .title-slide h2 {
      margin-top: -0.2em;
      color: var(--ink-soft);
      font-size: 0.92em;
      font-weight: 500;
    }
    .reveal .title-slide .title-meta {
      margin-top: 0.7em;
      padding-top: 0.44em;
      border-top: 1px solid var(--rule);
      color: var(--ink-soft);
      font-size: 0.6em;
      letter-spacing: 0.04em;
    }

    /* ---------- 图文网格 ---------- */
    .reveal .cluster-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.15em;
      align-items: start;
    }
    .reveal .cluster-grid > div { min-width: 0; }
    .reveal .cluster-grid > div > :first-child { margin-top: 0; }
    .reveal .cluster-grid > div > :last-child { margin-bottom: 0; }
    .reveal .cluster-tail { margin-top: 0.62em; }

    .reveal .image-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.06fr) minmax(0, 0.94fr);
      gap: 0.52em 1.2em;
      align-items: start;
    }
    .reveal .image-grid > div,
    .reveal .image-grid > p {
      min-width: 0;
      margin-top: 0;
      margin-bottom: 0;
    }
    .reveal .image-grid .image-tail { grid-column: 1 / -1; }
    .reveal .image-grid img { max-height: 390px; }

    .reveal .slide-body.with-visual {
      display: grid;
      grid-template-columns: minmax(0, 1.48fr) minmax(330px, 0.72fr);
      gap: 1.1em;
      align-items: center;
    }
    .reveal .slide-body.with-visual.visual-left {
      grid-template-columns: minmax(330px, 0.72fr) minmax(0, 1.48fr);
    }
    .reveal .visual-copy,
    .reveal .visual-stack,
    .reveal .slide-figure { min-width: 0; }
    .reveal .visual-copy > :first-child,
    .reveal .slide-figure > :first-child { margin-top: 0; }
    .reveal .visual-copy > :last-child,
    .reveal .slide-figure > :last-child { margin-bottom: 0; }

    .reveal img {
      display: block;
      max-width: 100%;
      max-height: 540px;
      margin-left: 0;
      margin-right: 0;
      object-fit: contain;
    }
    .reveal .slide-figure { margin: 0; }
    .reveal .slide-figure img {
      width: 100%;
      max-height: 470px;
      margin: 0;
      padding: 6px;
      background: #fff;
      border: 1px solid var(--rule);
      object-fit: contain;
    }
    .reveal .visual-stack {
      display: grid;
      gap: 0.55em;
      align-content: center;
    }
    .reveal .visual-stack .slide-figure img { max-height: 225px; }
    .reveal .slide-figure figcaption {
      margin-top: 0.34em;
      padding-left: 0.62em;
      border-left: 2px solid var(--rule-strong);
      color: var(--ink-soft);
      font-size: 0.42em;
      line-height: 1.24;
      text-align: left;
    }
    .reveal .slide-figure figcaption a {
      color: var(--ink-soft);
      text-decoration: underline;
    }
    /* 图注中的年代／性质标记 */
    .reveal .slide-figure figcaption .fig-kind {
      display: inline-block;
      margin-right: 0.4em;
      padding: 0.05em 0.4em;
      background: var(--paper-sunk);
      border: 1px solid var(--rule);
      border-radius: 2px;
      color: var(--ink-soft);
      font-size: 0.92em;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .reveal .title-slide .slide-figure img { max-height: 535px; }

    /* ============================================================
       组件：账目链 / 断裂链 / 组织形式 / 力量循环 / 当代场景
       ============================================================ */

    /* 账目链（第8页：八便士） */
    .reveal .ledger {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 0.5em;
      margin: 0.5em 0 0.45em;
      padding: 0.62em 0.75em;
      background: var(--paper-sunk);
      border-left: 3px solid var(--c-evidence);
    }
    .reveal .ledger-item {
      display: flex;
      flex-direction: column;
      gap: 0.1em;
      min-width: 0;
    }
    .reveal .ledger-item b {
      font-size: 1.42em;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      line-height: 1.05;
    }
    .reveal .ledger-item i {
      color: var(--ink-soft);
      font-size: 0.56em;
      font-style: normal;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .reveal .ledger-op {
      align-self: center;
      color: var(--ink-faint);
      font-size: 0.9em;
      line-height: 1;
    }
    .reveal .ledger-item.is-total b { color: var(--stage); font-size: 1.9em; }
    .reveal .ledger-item.is-total i { color: var(--stage); font-weight: 600; }

    /* 断裂链（第31页：五项政治转换） */
    .reveal .breaks {
      display: grid;
      gap: 0.34em;
      margin: 0.5em 0 0.45em;
    }
    .reveal .break-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 4.4em minmax(0, 1.12fr);
      align-items: center;
      gap: 0.3em;
    }
    .reveal .break-from {
      padding: 0.2em 0 0.2em 0.6em;
      border-left: 3px solid var(--rule-strong);
      color: var(--ink-soft);
    }
    .reveal .break-row:nth-child(1) .break-from { border-left-color: var(--c-notts); }
    .reveal .break-row:nth-child(2) .break-from { border-left-color: var(--c-yorks); }
    .reveal .break-row:nth-child(3) .break-from { border-left-color: var(--c-lancs); }
    .reveal .break-row:nth-child(4) .break-from { border-left-color: var(--c-notts); }
    .reveal .break-row:nth-child(5) .break-from { border-left-color: var(--c-yorks); }
    .reveal .break-gap {
      position: relative;
      height: 1px;
      background: linear-gradient(to right,
        var(--rule-strong) 0 38%,
        transparent 38% 62%,
        var(--rule-strong) 62% 100%);
    }
    .reveal .break-gap::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 0;
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 6px solid var(--rule-strong);
      transform: translateY(-50%);
    }
    .reveal .break-to {
      padding: 0.2em 0;
      color: var(--ink);
      font-weight: 650;
    }

    /* 组织形式（第49页） */
    .reveal .formcards {
      display: grid;
      gap: 0.06em;
      margin: 0.44em 0 0.4em;
      font-size: 0.88em;
    }
    .reveal .formcard {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.24fr) minmax(0, 1.24fr);
      gap: 0.1em 1.1em;
      align-items: baseline;
      padding: 0.34em 0 0.34em 0.68em;
      border-left: 3px solid var(--stage);
      border-bottom: 1px solid var(--rule);
    }
    .reveal .formcard:last-child { border-bottom: 0; }
    .reveal .formcard-name {
      color: var(--stage);
      font-weight: 650;
      line-height: 1.24;
    }
    .reveal .formcard-can,
    .reveal .formcard-risk { line-height: 1.26; }
    .reveal .formcard-can { color: var(--ink); }
    .reveal .formcard-risk { color: var(--ink-soft); }
    .reveal .formcard-can > span,
    .reveal .formcard-risk > span {
      display: block;
      margin-bottom: 0.06em;
      font-size: 0.66em;
      font-weight: 650;
      letter-spacing: 0.08em;
    }
    .reveal .formcard-can > span { color: var(--ink-faint); }
    .reveal .formcard-risk > span { color: var(--c-evidence); }
    .reveal .formcards-head {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.24fr) minmax(0, 1.24fr);
      gap: 1.1em;
      margin-bottom: 0.1em;
      padding-left: 0.68em;
      border-bottom: 2px solid var(--stage);
      color: var(--stage);
      font-size: 0.62em;
      font-weight: 650;
      letter-spacing: 0.08em;
    }

    /* 力量循环（第50页） */
    .reveal .cycle {
      display: grid;
      gap: 0.08em;
      margin: 0.42em 0 0.36em;
      padding: 0;
      list-style: none;
      font-size: 0.88em;
      counter-reset: cyc;
    }
    .reveal .cycle > li {
      display: grid;
      grid-template-columns: 1.5em minmax(0, 0.86fr) minmax(0, 1.15fr) minmax(0, 1.2fr);
      gap: 0.1em 0.9em;
      align-items: baseline;
      padding: 0.34em 0;
      border-bottom: 1px solid var(--rule);
      counter-increment: cyc;
    }
    .reveal .cycle > li:last-child { border-bottom: 0; }
    .reveal .cycle > li::before {
      content: counter(cyc);
      color: var(--stage);
      font-size: 0.78em;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    .reveal .cycle-have { color: var(--ink-soft); line-height: 1.26; }
    .reveal .cycle-move { color: var(--ink); font-weight: 650; line-height: 1.26; }
    .reveal .cycle-break { color: var(--ink-soft); line-height: 1.26; }
    .reveal .cycle-break::before {
      content: "断点";
      display: block;
      margin-bottom: 0.06em;
      color: var(--c-evidence);
      font-size: 0.66em;
      font-weight: 650;
      letter-spacing: 0.08em;
    }
    .reveal .cycle-head {
      display: grid;
      grid-template-columns: 1.5em minmax(0, 0.86fr) minmax(0, 1.15fr) minmax(0, 1.2fr);
      gap: 0.9em;
      padding-bottom: 0.12em;
      border-bottom: 2px solid var(--stage);
      color: var(--stage);
      font-size: 0.62em;
      font-weight: 650;
      letter-spacing: 0.08em;
    }
    .reveal .conclusion {
      margin-top: 0.5em;
      padding: 0.38em 0 0.38em 0.72em;
      border-left: 3px solid var(--stage);
      font-size: 0.92em;
      line-height: 1.3;
    }
    .reveal .conclusion b { color: var(--stage); }

    /* 当代场景（第51页） */
    .reveal .scenario {
      margin: 0.44em 0;
      padding: 0.5em 0.72em;
      background: var(--paper-sunk);
      border-left: 3px solid var(--stage);
      line-height: 1.32;
    }
    .reveal .scenario-tag {
      display: block;
      margin-bottom: 0.14em;
      color: var(--stage);
      font-size: 0.6em;
      font-weight: 650;
      letter-spacing: 0.1em;
    }
    .reveal .steps {
      display: grid;
      gap: 0.16em;
      margin: 0.4em 0;
      padding: 0;
      list-style: none;
      counter-reset: stp;
    }
    .reveal .steps > li {
      display: grid;
      grid-template-columns: 1.6em minmax(0, 1fr);
      align-items: baseline;
      counter-increment: stp;
      line-height: 1.3;
    }
    .reveal .steps > li::before {
      content: counter(stp);
      color: var(--stage);
      font-size: 0.8em;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    /* 结语页：回收开场母题 */
    .reveal .closing-method {
      display: grid;
      gap: 0.22em;
      margin: 0.44em 0;
    }
    .reveal .closing-method > span {
      padding-left: 0.66em;
      border-left: 3px solid var(--rule-strong);
      font-weight: 650;
      line-height: 1.3;
    }
    .reveal .closing-method > span:nth-child(1) { border-left-color: var(--c-notts); }

          text: "验尸结论：‘Wilful Murder by a person or persons unknown.’\n\n它确认陪审团把 William Horsfall 的死亡认定为一名或多名身份不明者故意杀害；它没有点名凶手，也没有保存后世流传的‘骑进卢德派鲜血’豪言。后一句只能追到 Frank Peel 1880 年的地方叙事。\n\n来源：TNA HO 42/122；Leeds Mercury，2 May 1812。",

        "source-reform-or-death": {
          mode: "source",
          title: "1812 年兰开夏匿名纺纱工信",
          text: "结尾原文：‘Reform or Death.’\n\n信中作者称棉纺工帮助厂主积累财富，却指责厂主雇用过多女性，导致写信者及其孩子缺少面包。它把就业、生计和男性供养者资格写成同一项正义要求，也把排斥女性有薪劳动写进‘改革’语言。\n\n来源：匿名致 Kirkby 信，TNA HO 42/120；Binfield，N1，pp. 168–169。",

        "source-fellow-weavers": {
          mode: "source",
          title: "1812 年 3 月，Fellow Weavers! 传单",
          text: "原文反问：‘What right has any man to prevent thousands from buying their goods cheap?’\n\n署名 ‘An Old Weaver’ 的传单把蒸汽机、运河和机械同降低成本、扩大市场与增加总体就业联系起来，并以桥梁取代摆渡等类比为机械化辩护。署名不能证明作者身份，论证也不能证明其就业判断已经实现。\n\n来源：TNA HO 40/1/1, f. 108；英国国家档案馆教学材料 Source 4。",
          maxLength: 560
        },
        "source-thompson-making": {
          mode: "source",
          title: "汤普森：工人阶级的形成",
          text: "英文原文：‘The working class did not rise like the sun at an appointed time. It was present at its own making.’\n\n直译：工人阶级并不像太阳那样在预定时刻升起；它在自身形成的过程中已经在场。这里的重点不是把阶级视为结构自动生成的实体，而是把它理解为人们在关系、经验与冲突中共同形成的历史过程。\n\n来源：E. P. Thompson，The Making of the English Working Class，Preface。",

        "source-thompson-moral-economy": {

        "source-dumfries-letter": {
          mode: "source",
          title: "1814 年 6 月 16 日，致 Dumfries 同行信",
          text: "信中称约 300 名 plain-silk hands 已停工六周以上，要求每双增加 2d，并写道：‘Hosiers have formed a powerful Combination against us.’ 同信寄出 4 Articles 和 60 Diplomas，邀请建立分会。\n\n这些数字是写信人的动员性陈述，不是独立审计；材料证明停工、章程、凭状与跨地区联系存在，不能证明六十人已入会或卢德组织完整延续。\n\n来源：S. Simpson 致 Dumfries 同行，TNA HO 42/140；Binfield，M42，pp. 144–146。",

        },
        "source-nottingham-circular": {
          mode: "source",
          title: "1812 年 7 月 16 日，‘委员会’圆函",
          text: "圆函自称 ‘The C--m---tee’，说雇主试图以费用拖垮工人的 ‘fortitude and finances’，并要求继续既有的 ‘steady line of conduct’。它还讨论乡村货物流入、长期 ‘struggle’、通信落入伦敦雇主之手的风险，并要求阅后销毁。\n\n文本把谈判、资金、供应、纪律和保密放在一起，却没有直接发出毁机命令。\n\n来源：TNA HO 42/125；Binfield，M39。",
          maxLength: 560
        },
        "source-bullwell-coded-letter": {
          mode: "source",
          title: "1812 年 9 月，Bullwell 遮字信",
          text: "表层全文：‘The Committee for the relief of the Poor meet on Wednesday night at 8 o’clock when the case of the woman who lives on Bullwell Common will be taken into consideration.’\n\n覆上开有长孔的遮字密钥后，显出的讯息是：‘The Committee / meet on Wednesday night at 8 o’clock / on Bullwell Common.’\n\n它证明一套实际可用的遮字法曾被用于隐藏会议时间与地点，不能由此推定会议人员、议程或全地区共用同一密码。\n\n来源：TNA HO 42/127；Binfield，M40。",

        "source-houghton-work-letter": {

          title: "1812 年 4 月 19 日，G. D. 截获私信",

          maxLength: 560
        },
        "source-booth-peel-memory": {
          mode: "source",

          text: "晚出叙事中的对白：‘Can you keep a secret?’ — ‘So can I.’\n\nFrank Peel 的地方史还加入旅馆、拒绝救治与逼供等场景，并使用 ‘Tradition says’、‘It is said’、‘old people say’ 一类传闻标记。这句话适合研究 Booth 如何被塑造成忠诚的殉道者，但不是 1812 年新闻、验尸或供词中的逐字记录。\n\n来源：Frank Peel，The Risings of the Luddites, Chartists and Plug-Drawers，1880。",
          maxLength: 560
        },
        "source-horsfall-peel-memory": {
          mode: "source",
          title: "1880 年 Frank Peel 记录的 Horsfall 豪言",
          text: "晚出归属语：‘ride up to his saddle girths in Luddite blood’（在卢德派的血中骑到马鞍肚带）。\n\n目前可追溯的引注链把这句话引向 Frank Peel 1880 年地方史第 129 页；同时代新闻、外科陈述和验尸材料能确认 Horsfall 遇袭与死亡，却没有保存这句逐字原话。它可以作为十九世纪末地方记忆来讲，不能倒写成 1812 年已核事实或刺杀的单一动机。\n\n来源：Frank Peel，The Risings… (1880)，p. 129；Richard Price 后以 allegedly claimed 转引。",

        },
        "source-mellor-york-letter": {
          mode: "source",
          title: "1812 年 11 月 30 日，Mellor 的约克城堡信",
          text: "信件一部分要求 Thomas Ellis 转告亲属坚持此前关于停留时间、离开时间和携带物品的陈述，并反驳一名男孩可能给出的不同说法；另一部分谈议会改革请愿，要求把约四十个名字列入，其中包括 ‘G. M.’。\n\n这是一封候审者的辩护与请愿通信，不是政治纲领。现存文本是被截获并经选编转录的副本。\n\n来源：Radcliffe Papers 126/127(a)；TNA HO 42/123；Binfield，Y22，p. 233。",
          maxLength: 560
        }

      const termTriggers = Array.from(document.querySelectorAll(".term-explainer"));
      if (termTriggers.length) {
        const termCard = document.createElement("aside");
        termCard.id = "term-explainer-card";
        termCard.className = "term-explainer-card";
        termCard.setAttribute("role", "tooltip");
        termCard.setAttribute("aria-hidden", "true");
        termCard.dataset.open = "false";
        termCard.dataset.hasImage = "false";
        termCard.dataset.mode = "default";
        termCard.innerHTML = [
          '<h2 class="term-explainer-card__title"></h2>',
          '<img class="term-explainer-card__image" alt="">',
          '<p class="term-explainer-card__text"></p>'
        ].join("");
        document.body.appendChild(termCard);

        const termCardTitle = termCard.querySelector(".term-explainer-card__title");
        const termCardImage = termCard.querySelector(".term-explainer-card__image");
        const termCardText = termCard.querySelector(".term-explainer-card__text");
        let activeTermTrigger = null;
        let termCloseTimer = null;

        const positionTermCard = () => {
          if (!activeTermTrigger || termCard.dataset.open !== "true") return;
          const triggerRect = activeTermTrigger.getBoundingClientRect();
          const cardRect = termCard.getBoundingClientRect();
          const viewportGap = 12;
          const triggerGap = 10;
          let left = triggerRect.left + triggerRect.width / 2 - cardRect.width / 2;
          left = Math.max(viewportGap, Math.min(left, window.innerWidth - cardRect.width - viewportGap));
          let top = triggerRect.bottom + triggerGap;
          if (top + cardRect.height > window.innerHeight - viewportGap) {
            top = triggerRect.top - cardRect.height - triggerGap;
          }
          top = Math.max(viewportGap, Math.min(top, window.innerHeight - cardRect.height - viewportGap));
          termCard.style.left = Math.round(left) + "px";
          termCard.style.top = Math.round(top) + "px";
        };

        const openTermCard = (trigger) => {
          const triggerSlide = trigger.closest(".reveal .slides section");
          // 纵向模式下所有页同时在文档流中，不存在唯一的 present 页
          if (!triggerSlide || (!DOC_MODE && !triggerSlide.classList.contains("present"))) return;
          if (termCloseTimer) window.clearTimeout(termCloseTimer);
          if (activeTermTrigger && activeTermTrigger !== trigger) {
            activeTermTrigger.setAttribute("aria-expanded", "false");
          }
          activeTermTrigger = trigger;
          const catalogEntry = termCardCatalog[trigger.dataset.termKey] || {};
          const cardTitle = trigger.dataset.termTitle || catalogEntry.title || trigger.textContent.trim();
          const cardMode = trigger.dataset.termMode || catalogEntry.mode || "default";
          const rawCardText = trigger.dataset.termText || catalogEntry.text || "";
          const configuredLimit = Number(trigger.dataset.termMaxLength || catalogEntry.maxLength);
          const cardTextLimit = Number.isFinite(configuredLimit) && configuredLimit > 0
            ? configuredLimit
            : cardMode === "source" ? 560 : 420;
          const cardText = rawCardText.length > cardTextLimit
            ? rawCardText.slice(0, cardTextLimit).trimEnd() + "…"
            : rawCardText;
          termCardTitle.textContent = cardTitle;
          termCardText.textContent = cardText;
          termCardText.scrollTop = 0;
          const imageSource = trigger.dataset.termImage || catalogEntry.image || "";
          termCard.dataset.hasImage = imageSource ? "true" : "false";
          termCard.dataset.mode = cardMode;
          termCard.setAttribute("aria-label", cardTitle);
          if (imageSource) {
            termCardImage.src = imageSource;
            termCardImage.alt = trigger.dataset.termImageAlt || catalogEntry.imageAlt || "";
          } else {
            termCardImage.removeAttribute("src");
            termCardImage.alt = "";
          }
          trigger.setAttribute("aria-expanded", "true");
          termCard.dataset.open = "true";
          termCard.setAttribute("aria-hidden", "false");
          window.requestAnimationFrame(positionTermCard);
        };

        const closeTermCard = () => {
          if (termCloseTimer) window.clearTimeout(termCloseTimer);
          if (activeTermTrigger) activeTermTrigger.setAttribute("aria-expanded", "false");
          activeTermTrigger = null;
          termCard.dataset.open = "false";
          termCard.setAttribute("aria-hidden", "true");
        };

        const scheduleTermCardClose = () => {
          if (termCloseTimer) window.clearTimeout(termCloseTimer);
          termCloseTimer = window.setTimeout(closeTermCard, 120);
        };

        termTriggers.forEach((trigger) => {
          if (!trigger.hasAttribute("tabindex")) trigger.tabIndex = 0;
          trigger.setAttribute("role", "button");
          trigger.setAttribute("aria-controls", termCard.id);
          trigger.setAttribute("aria-describedby", termCard.id);
          trigger.setAttribute("aria-expanded", "false");
          trigger.addEventListener("pointerenter", () => openTermCard(trigger));
          trigger.addEventListener("pointerleave", scheduleTermCardClose);
          trigger.addEventListener("focus", () => openTermCard(trigger));
          trigger.addEventListener("blur", scheduleTermCardClose);
          trigger.addEventListener("pointerup", (event) => {
            if (event.pointerType !== "mouse") {
              event.preventDefault();
              event.stopPropagation();
              openTermCard(trigger);
            }
          });
          trigger.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
          });
          trigger.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              if (activeTermTrigger === trigger && termCard.dataset.open === "true") closeTermCard();
              else openTermCard(trigger);
            }
          });
        });

        termCard.addEventListener("pointerenter", () => {
          if (termCloseTimer) window.clearTimeout(termCloseTimer);
        });
        termCard.addEventListener("pointerleave", scheduleTermCardClose);
        termCardImage.addEventListener("error", () => {
          termCard.dataset.hasImage = "false";
        termCard.dataset.mode = "default";
          positionTermCard();
        });
        document.addEventListener("pointerdown", (event) => {
          if (!termCard.contains(event.target) && !termTriggers.some((trigger) => trigger.contains(event.target))) {
            closeTermCard();
          }
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeTermCard();
        });
        document.addEventListener("scroll", positionTermCard, true);
        window.addEventListener("resize", positionTermCard);
        Reveal.on("slidechanged", closeTermCard);
      }

      function makeThreeColumnPairs(page, pairCount = 3) {
        const body = slides[page - 1]?.querySelector(":scope > .slide-body");
        if (!body) return;
        const nodes = Array.from(body.children);
        if (nodes.length < pairCount * 2) return;
        const grid = document.createElement("div");
        grid.className = "cluster-grid";
        for (let index = 0; index < pairCount; index += 1) {
          const group = document.createElement("div");
          group.append(nodes[index * 2], nodes[index * 2 + 1]);
          grid.appendChild(group);
        }
        const tail = document.createElement("div");
        tail.className = "cluster-tail";
        nodes.slice(pairCount * 2).forEach((node) => tail.appendChild(node));
        body.replaceChildren(grid);
        if (tail.childNodes.length) body.appendChild(tail);
      }
      [].forEach((page) => makeThreeColumnPairs(page));
      const imageBody = null;
      if (imageBody) {
        const nodes = Array.from(imageBody.children);
        if (nodes.length >= 6) {
          const grid = document.createElement("div");
          grid.className = "image-grid";
          const lead = document.createElement("div");
          lead.append(nodes[0], nodes[1]);
          grid.append(lead, nodes[2]);
          const tail = document.createElement("div");
          tail.className = "image-tail";
          nodes.slice(3).forEach((node) => tail.appendChild(node));
          grid.appendChild(tail);
          imageBody.replaceChildren(grid);
        }
      }
      // 让进度条／纵向进度条跟随当前阶段色
      const applyStage = (slide) => {
        const key = stageOfSlide.get(slide);
        if (key) revealRoot.dataset.stage = key;
      };

      if (DOC_MODE) {
        const rail = document.createElement("div");
        rail.className = "doc-mode-rail";
        rail.innerHTML = "<span></span>";
        const railFill = rail.firstElementChild;
        document.body.appendChild(rail);
        let railQueued = false;
        const updateRail = () => {
          railQueued = false;
          const scrollable = document.documentElement.scrollHeight - window.innerHeight;
          const ratio = scrollable > 0 ? window.scrollY / scrollable : 0;
          railFill.style.width = Math.min(100, Math.max(0, ratio * 100)) + "%";
          const midpoint = window.innerHeight * 0.35;
          const current = slides.find((slide) => {
            const rect = slide.getBoundingClientRect();
            return rect.top <= midpoint && rect.bottom > midpoint;
          });
          if (current) {
            applyStage(current);
            rail.style.setProperty("--stage", getComputedStyle(current).getPropertyValue("--stage"));
          }
        };
        const queueRail = () => {
          if (railQueued) return;
          railQueued = true;
          requestAnimationFrame(updateRail);
        };
        window.addEventListener("scroll", queueRail, { passive: true });
        window.addEventListener("resize", queueRail);
        updateRail();
      } else {
        applyStage(Reveal.getCurrentSlide() || slides[0]);
        Reveal.on("slidechanged", (event) => applyStage(event.currentSlide));
        requestAnimationFrame(() => Reveal.layout());
      }

      // 桌面与纵向模式的排版差异过大，跨越断点时重新加载一次
      let modeSwitchTimer = null;
      window.addEventListener("resize", () => {
        if (modeSwitchTimer) window.clearTimeout(modeSwitchTimer);
        modeSwitchTimer = window.setTimeout(() => {
          if (window.matchMedia(DOC_MODE_QUERY).matches !== DOC_MODE) window.location.reload();
        }, 450);
      });
    });
  </script>
