<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>砸机器之后：观众版逐页内容</title>
  <link rel="stylesheet" href="/static/revealjs/reset.css">
  <link rel="stylesheet" href="/static/revealjs/reveal.css">
  <link rel="stylesheet" href="/static/revealjs/theme/white.css" id="theme">
  <style>
    :root {
      --r-background-color: #fff;
      --r-main-color: #000;
      --r-heading-color: #000;
      --r-main-font: system-ui, -apple-system, "Segoe UI", sans-serif;
      --r-heading-font: system-ui, -apple-system, "Segoe UI", sans-serif;
      --r-link-color: #000;
      --r-link-color-hover: #000;
    }
    .reveal {
      background: #fff;
      color: #000;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .reveal .slides section {
      box-sizing: border-box;
      height: 100%;
      padding: 46px 80px;
      text-align: left;
      font-size: 32px;
      line-height: 1.32;
    }
    .reveal .slides section.present {
      display: flex !important;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      text-align: left;
    }
    .reveal .slide-body {
      min-width: 0;
      width: 100%;
      margin-left: 0;
      margin-right: 0;
      text-align: left;
    }
    .reveal .slides section.present > h1,
    .reveal .slides section.present > .slide-body {
      width: 100%;
      align-self: stretch;
      margin-left: 0;
      margin-right: 0;
      text-align: left !important;
    }
    .reveal .slide-body > * {
      margin-left: 0;
      margin-right: 0;
      text-align: left !important;
    }
    .reveal .slide-body > :first-child {
      margin-top: 0;
    }
    .reveal .slide-body > :last-child {
      margin-bottom: 0;
    }
    .reveal h1,
    .reveal h2,
    .reveal h3,
    .reveal h4 {
      color: #000;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-transform: none;
      letter-spacing: normal;
    }
    .reveal h1 {
      margin: 0 0 0.56em;
      font-size: 1.42em;
      line-height: 1.16;
    }
    .reveal h2 { font-size: 1.18em; }
    .reveal h3 { font-size: 1.05em; }
    .reveal p,
    .reveal ul,
    .reveal ol {
      margin-top: 0.34em;
      margin-bottom: 0.34em;
    }
    .reveal ul,
    .reveal ol {
      padding-left: 1.15em;
    }
    .reveal li + li {
      margin-top: 0.12em;
    }
    .reveal table {
      width: 100%;
      margin: 0.22em 0 0.38em;
      font-size: 0.84em;
      line-height: 1.22;
    }
    .reveal th,
    .reveal td {
      padding: 0.22em 0.32em;
      vertical-align: top;
    }
    .reveal blockquote {
      width: 100%;
      margin: 0.34em 0;
      padding: 0;
      font-size: 1.01em;
      line-height: 1.32;
      box-shadow: none;
    }
    .reveal img {
      display: block;
      max-width: 100%;
      max-height: 540px;
      margin-left: 0;
      margin-right: 0;
      object-fit: contain;
    }
    .reveal a {
      color: #000;
      text-decoration: underline;
      overflow-wrap: anywhere;
    }
    .reveal .source-line {
      margin-top: 0.62em;
      font-size: 0.7em;
      line-height: 1.26;
    }
    .reveal .slides section.size-roomy {
      font-size: 35px;
    }
    .reveal .slides section.size-dense {
      font-size: 29px;
    }
    .reveal .slides section.size-compact {
      padding-top: 34px;
      padding-bottom: 34px;
      font-size: 28px;
      line-height: 1.25;
    }
    .reveal .size-compact h1 {
      margin-bottom: 0.42em;
    }
    .reveal .size-compact p,
    .reveal .size-compact ul,
    .reveal .size-compact ol {
      margin-top: 0.24em;
      margin-bottom: 0.24em;
    }
    .reveal .slides section.title-slide {
      font-size: 39px;
    }
    .reveal .title-slide h1 {
      font-size: 1.65em;
    }
    .reveal .cluster-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.15em;
      align-items: start;
    }
    .reveal .cluster-grid > div {
      min-width: 0;
    }
    .reveal .cluster-grid > div > :first-child {
      margin-top: 0;
    }
    .reveal .cluster-grid > div > :last-child {
      margin-bottom: 0;
    }
    .reveal .cluster-tail {
      margin-top: 0.62em;
    }
    .reveal .image-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.06fr) minmax(0, 0.94fr);
      gap: 0.52em 1.2em;
      align-items: start;
    }
    .reveal .image-grid > div,
    .reveal .image-grid > p {
      min-width: 0;
      margin-top: 0;
      margin-bottom: 0;
    }
    .reveal .image-grid .image-tail {
      grid-column: 1 / -1;
    }
    .reveal .image-grid img {
      max-height: 390px;
    }
    .reveal .slide-body.with-visual {
      display: grid;
      grid-template-columns: minmax(0, 1.48fr) minmax(330px, 0.72fr);
      gap: 1em;
      align-items: center;
    }
    .reveal .slide-body.with-visual.visual-left {
      grid-template-columns: minmax(330px, 0.72fr) minmax(0, 1.48fr);
    }
    .reveal .visual-copy,
    .reveal .visual-stack,
    .reveal .slide-figure {
      min-width: 0;
    }
    .reveal .visual-copy > :first-child,
    .reveal .slide-figure > :first-child {
      margin-top: 0;
    }
    .reveal .visual-copy > :last-child,
    .reveal .slide-figure > :last-child {
      margin-bottom: 0;
    }
    .reveal .slide-figure {
      margin: 0;
    }
    .reveal .slide-figure img {
      width: 100%;
      max-height: 470px;
      margin: 0;
      border: 1px solid #aaa;
      background: #fff;
      object-fit: contain;
    }
    .reveal .visual-stack {
      display: grid;
      gap: 0.48em;
      align-content: center;
    }
    .reveal .visual-stack .slide-figure img {
      max-height: 225px;
    }
    .reveal .slide-figure figcaption {
      margin-top: 0.32em;
      color: #000;
      font-size: 0.43em;
      line-height: 1.2;
      text-align: left;
    }
    .reveal .slide-figure figcaption a {
      color: #000;
      text-decoration: underline;
    }
    .reveal .title-slide .slide-figure img {
      max-height: 535px;
    }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section
        data-markdown="/static/slides/after-the-machines-plain-v5.md"
        data-separator="^---\r?$"
        data-separator-vertical="^--\r?$"
        data-charset="utf-8"
      ></section>
    </div>
  </div>
  <script src="/static/revealjs/reveal.js"></script>
  <script src="/static/revealjs/plugin/markdown.js"></script>
  <script src="/static/revealjs/plugin/notes.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      controls: true,
      progress: true,
      slideNumber: false,
      center: false,
      width: 1600,
      height: 900,
      margin: 0.035,
      transition: "none",
      backgroundTransition: "none",
      navigationMode: "linear",
      markdown: { smartypants: false },
      plugins: [RevealMarkdown, RevealNotes]
    }).then(() => {
      const slides = Array.from(document.querySelectorAll(".reveal .slides section"));
      const roomyPages = new Set([1, 2, 7, 17, 26, 31, 33, 54, 56, 57, 61, 73, 74, 75, 76, 77]);
      const densePages = new Set([13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 34, 35, 36, 38, 39, 40, 41, 42, 43, 46, 48, 49, 50, 51, 52, 53, 55, 59, 60, 62, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72]);
      const compactPages = new Set([20, 21, 23, 24, 30, 42, 52, 60, 66, 67, 71, 72]);
      slides.forEach((slide, index) => {
        const page = index + 1;
        slide.classList.add('page-' + page);
        if (roomyPages.has(page)) slide.classList.add("size-roomy");
        if (densePages.has(page)) slide.classList.add("size-dense");
        if (compactPages.has(page)) slide.classList.add("size-compact");
        if (page === 1 || page === 61) slide.classList.add("title-slide");
        const heading = slide.querySelector(":scope > h1, :scope > h2");
        if (!heading) return;
        const body = document.createElement("div");
        body.className = "slide-body";
        Array.from(slide.childNodes).forEach((node) => {
          if (node !== heading && !(node.nodeType === 1 && node.matches("aside.notes"))) body.appendChild(node);
        });
        slide.appendChild(body);
        const staticVisual = body.querySelector(":scope > .visual-stack");
        if (staticVisual) {
          const copy = document.createElement("div");
          copy.className = "visual-copy";
          Array.from(body.childNodes).forEach((node) => {
            if (node !== staticVisual) copy.appendChild(node);
          });
          body.classList.add("with-visual");
          if (slide.classList.contains("layout-visual-left")) {
            body.classList.add("visual-left");
            body.replaceChildren(staticVisual, copy);
          } else {
            body.replaceChildren(copy, staticVisual);
          }
        }
        body.querySelectorAll("p").forEach((paragraph) => {
          if (/^来源[：:]/.test(paragraph.textContent.trim())) paragraph.classList.add("source-line");
        });
      });
      slides.forEach((slide, index) => {
        slide.querySelectorAll("img").forEach((image) => {
          image.loading = index === 0 ? "eager" : "lazy";
          image.decoding = "async";
        });
      });
      function makeThreeColumnPairs(page, pairCount = 3) {
        const body = slides[page - 1]?.querySelector(":scope > .slide-body");
        if (!body) return;
        const nodes = Array.from(body.children);
        if (nodes.length < pairCount * 2) return;
        const grid = document.createElement("div");
        grid.className = "cluster-grid";
        for (let index = 0; index < pairCount; index += 1) {
          const group = document.createElement("div");
          group.append(nodes[index * 2], nodes[index * 2 + 1]);
          grid.appendChild(group);
        }
        const tail = document.createElement("div");
        tail.className = "cluster-tail";
        nodes.slice(pairCount * 2).forEach((node) => tail.appendChild(node));
        body.replaceChildren(grid);
        if (tail.childNodes.length) body.appendChild(tail);
      }
      [8, 35, 50, 78].forEach((page) => makeThreeColumnPairs(page));
      const imageBody = slides[29]?.querySelector(":scope > .slide-body");
      if (imageBody) {
        const nodes = Array.from(imageBody.children);
        if (nodes.length >= 6) {
          const grid = document.createElement("div");
          grid.className = "image-grid";
          const lead = document.createElement("div");
          lead.append(nodes[0], nodes[1]);
          grid.append(lead, nodes[2]);
          const tail = document.createElement("div");
          tail.className = "image-tail";
          nodes.slice(3).forEach((node) => tail.appendChild(node));
          grid.appendChild(tail);
          imageBody.replaceChildren(grid);
        }
      }
      requestAnimationFrame(() => Reveal.layout());
    });
  </script>
</body>
</html>
